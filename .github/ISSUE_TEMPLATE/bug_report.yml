name: Bug 报告
description: 报告可以稳定复现的产品问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿上传 API Key、真实业务文件或个人信息。
  - type: input
    id: version
    attributes:
      label: 知意版本
      placeholder: 例如 v0.1.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 使用方式
      options:
        - Windows 安装包
        - 源码开发环境
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用脱敏或合成数据描述。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的错误信息
      render: shell
