name: Verify Windows source and package

on:
  pull_request:
  push:
    branches: [main, master, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Source verification and candidate builds only; never publish a Release.
    if: github.repository == 'ha123-png/zhiyi'
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.0'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.29'
          python-version: '3.12.12'
          enable-cache: false
      - name: Install locked dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --project apps/api --dev --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Python and whitespace
        run: |
          uv run --project apps/api --no-sync ruff check apps/api/src apps/api/tests scripts/prepare-acceptance.py scripts/smoke-upgrade.py scripts/smoke-smart.py scripts/smoke-invoice.py scripts/prepare-source-acceptance.py scripts/smoke-prefix.py scripts/prepare-card-acceptance.py scripts/serve-verification.py scripts/smoke-design-journey.py scripts/smoke-template-contract.py scripts/verify-release-model.py scripts/verify-release-pressure.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
      - name: Web tests
        run: npm run test:web
      - name: Web build
        run: npm run build:web
      - name: API, migration and Windows lifecycle tests
        run: uv run --project apps/api --no-sync pytest apps/api/tests --basetemp="${{ runner.temp }}/zhiyi-tests-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Install headless browser
        run: npx playwright install --only-shell chromium
      - name: Isolated browser journeys without model calls
        run: npm run test:browser
      - name: Bounded format and queue integrity checks
        run: uv run --project apps/api --no-sync python scripts/verify-release-pressure.py
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-verification
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .local/browser-verification/**/*.log
            .local/browser-verification/**/visual/**
            .local/browser-verification/**/passed.json
            .local/release-pressure/**/report.json

  windows-package:
    needs: verify
    if: github.repository == 'ha123-png/zhiyi' && github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.0'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.29'
          python-version: '3.12.12'
          enable-cache: false
      - name: Install locked build dependencies and NSIS
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --project apps/api --dev --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Upgrade the parent package too: hosted Windows includes nsis 3.10,
          # whose exact dependency otherwise prevents upgrading nsis.install.
          choco upgrade nsis --version=3.12.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build audited Windows package
        run: ./scripts/build-release.ps1 -BuildInstaller
      - name: Check packaged install and uninstall with isolated data
        run: ./scripts/smoke-release-lifecycle.ps1
      - name: Keep Windows candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-candidate-${{ github.sha }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .local/release/dist/installer/*-win-x64-setup.exe
            .local/release/dist/RELEASE_MANIFEST.json
            .local/release/dist/SHA256SUMS.txt
            .local/release/dist/resources/**
