[project]
name = "document-pipeline-api"
version = "0.3.0"
description = "Local-first multimodal document data pipeline API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "huey==3.3.0",
  "mcp==1.28.1",
  "openpyxl==3.1.5",
  "pillow>=12.3.0",
  "pydantic==2.13.4",
  "pypdfium2>=5.12.1",
  "python-multipart==0.0.31",
  "pywebview==6.1",
  "regex==2026.9.10",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
document-pipeline-mcp = "document_pipeline_api.mcp_server:main"
document-pipeline = "document_pipeline_api.launcher:main"
document-pipeline-rule-audit = "document_pipeline_api.rule_audit:main"

[dependency-groups]
dev = [
  "pip-audit==2.10.1",
  "pyinstaller==6.21.0",
  "pytest==9.0.3",
  "ruff==0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_pipeline_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
